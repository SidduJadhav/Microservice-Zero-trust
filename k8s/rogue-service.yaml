apiVersion: apps/v1
kind: Deployment
metadata:
  name: rogue-service
  namespace: zerotrust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rogue-service
  template:
    metadata:
      labels:
        app: rogue-service
    spec:
      containers:
        - name: rogue-service
          image: zerotrust/rogue-service:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          env:
            # Optimize for low memory: reduce thread count and JVM overhead
            - name: BPL_JVM_THREAD_COUNT
              value: "50"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70.0 -XX:ReservedCodeCacheSize=120M -XX:MaxMetaspaceSize=80M"
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "640Mi"  # Increased from 512Mi
              cpu: "400m"

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 5
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 8
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rogue-service
  namespace: zerotrust
spec:
  type: ClusterIP
  selector:
    app: rogue-service
  ports:
    - port: 8084
      targetPort: 8084