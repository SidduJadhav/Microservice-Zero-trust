# API Gateway certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-gateway-cert
  namespace: zerotrust
spec:
  secretName: api-gateway-tls
  commonName: api-gateway
  dnsNames:
    - api-gateway
    - api-gateway.zerotrust.svc.cluster.local
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: zerotrust-ca-issuer
    kind: Issuer
--- 
