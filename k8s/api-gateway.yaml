apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: zerotrust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        - name: create-keystore
          image: eclipse-temurin:25-jre
          command:
            - sh
            - -c
            - |
              apt-get update -qq && apt-get install -y -qq openssl 2>/dev/null
              openssl pkcs12 -export \
                -in /certs/tls.crt \
                -inkey /certs/tls.key \
                -out /keystores/keystore.p12 \
                -passout pass:changeit \
                -name service-cert
              keytool -importcert \
                -file /certs/ca.crt \
                -keystore /keystores/truststore.p12 \
                -storetype PKCS12 \
                -storepass changeit \
                -alias zerotrust-ca \
                -noprompt
              echo "Keystores created successfully"
              chmod 644 /keystores/keystore.p12
              chmod 644 /keystores/truststore.p12
              ls -la /keystores/
          volumeMounts:
            - name: tls-certs
              mountPath: /certs/tls.crt
              subPath: tls.crt
            - name: tls-certs
              mountPath: /certs/tls.key
              subPath: tls.key
            - name: ca-cert
              mountPath: /certs/ca.crt
              subPath: tls.crt
            - name: keystores
              mountPath: /keystores
      containers:
        - name: api-gateway
          image: zerotrust/api-gateway:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
            - containerPort: 8090
          env:
            - name: SERVER_SSL_ENABLED
              value: "true"
            - name: SERVICES_ORDER_URL
              value: "https://order-service:8081"
            - name: MANAGEMENT_SERVER_PORT
              value: "8090"
            - name: MANAGEMENT_SERVER_SSL_ENABLED
              value: "false"
            - name: BPL_JVM_THREAD_COUNT
              value: "75"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70.0 -XX:ReservedCodeCacheSize=120M -XX:MaxMetaspaceSize=80M"
          volumeMounts:
            - name: tls-certs
              mountPath: /certs/tls.crt
              subPath: tls.crt
            - name: tls-certs
              mountPath: /certs/tls.key
              subPath: tls.key
            - name: ca-cert
              mountPath: /certs/ca.crt
              subPath: tls.crt
            - name: keystores
              mountPath: /certs
          resources:
            requests:
              memory: "448Mi"  # Slightly higher for gateway
              cpu: "150m"
            limits:
              memory: "768Mi"  # Gateway needs more memory
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8090
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8090
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 5
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8090
              scheme: HTTP
            initialDelaySeconds: 180
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 5
      volumes:
        - name: tls-certs
          secret:
            secretName: api-gateway-tls
        - name: ca-cert
          secret:
            secretName: zerotrust-ca-secret
        - name: keystores
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: zerotrust
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080