# Step 1: Create a self-signed issuer to bootstrap the CA
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: zerotrust
spec:
  selfSigned: {}
---
# Step 2: Create the CA certificate signed by the self-signed issuer
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zerotrust-ca
  namespace: zerotrust
spec:
  isCA: true
  commonName: zerotrust-ca
  secretName: zerotrust-ca-secret
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
---
# Step 3: Create a CA issuer that signs service certificates
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: zerotrust-ca-issuer
  namespace: zerotrust
spec:
  ca:
    secretName: zerotrust-ca-secret