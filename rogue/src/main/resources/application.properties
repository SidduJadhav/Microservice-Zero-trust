# ==========================================
# Rogue Service ? application.properties
# ==========================================

# Same port as Payment Service ? impersonation is done
# at K8s Service level (label selector), not port level
server.port=8084
spring.application.name=payment-service

# Deliberately named "payment-service" above so Spring banner
# and logs look identical to the legitimate service

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- Logging ---
# ERROR level so stolen data lines are unmissable in demo
logging.level.com.zerotrust=ERROR
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
management.endpoint.health.probes.enabled=true
